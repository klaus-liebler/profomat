# ProfOMat: PostgreSQL 17 für Entwicklung und Tests.
# Starten:  docker compose -f deploy/docker-compose.yml up -d
# Eigener Port 5443 (SchulPerfekt 5440, VibeVHS 5441, FraktionPerfekt 5442), damit alle Projekte nebeneinander laufen; nur auf 127.0.0.1.
name: profomat
services:
  db:
    image: postgres:17
    # Tests legen je Test eine Wegwerf-Datenbank aus einer Vorlage an (viele Verbindungen gleichzeitig);
    # fsync/synchronous_commit aus nur hier in der Entwicklung (schneller), nie auf dem Server.
    command: ["postgres", "-c", "max_connections=300", "-c", "shared_buffers=256MB", "-c", "fsync=off", "-c", "synchronous_commit=off", "-c", "full_page_writes=off"]
    environment:
      POSTGRES_USER: profomat
      # Nur für die lokale Entwicklung; der Server hat einen eigenen Zufallswert (deploy/server, Schritt postgresql.sh).
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-entwicklung}
      POSTGRES_DB: profomat
    ports:
      - "127.0.0.1:5443:5432"
    volumes:
      - profomat-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U profomat"]
      interval: 5s
      retries: 20
volumes:
  profomat-db:
