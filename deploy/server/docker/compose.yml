# Anwendung als Container (Modus docker) – Vorlage des Deploy-Kits (KIT-DATEI); ausrollen.sh füllt @…@ aus konfiguration.env und
# umgebung.kit und legt sie als /opt/@DIENST@-docker/compose.yml ab, dazu .env (0600) mit BILD (Version), UID/GID des Dienstbenutzers
# und dem Datenbankpasswort. Die Datenbank ist der Container @DB_CONTAINER@ (postgres:17, Schritt postgresql.sh) im Netz @DB_NETZ@ –
# derselbe wie bei nativem Betrieb, ein Wechsel der Betriebsart lässt die Daten, wo sie sind.
name: @DIENST@
services:
  app:
    image: ${BILD:?BILD fehlt in .env}
    container_name: @DIENST@
    restart: unless-stopped
    user: "${DIENST_UID:?}:${DIENST_GID:?}"
    env_file:
      - path: /etc/@DIENST@/@DIENST@.env
        required: false
    environment:
@UMGEBUNG_COMPOSE@
      # im Container-Netz zur Datenbank (überschreibt die Verbindung über 127.0.0.1 aus der Umgebungsdatei)
      ConnectionStrings__@VERBINDUNG@: "Host=@DB_CONTAINER@;Port=5432;Database=@DB_NAME@;Username=@DIENST@;Password=${POSTGRES_PASSWORD:?}"
    ports:
      - "127.0.0.1:@PORT@:8080"      # nur lokal, nach außen spricht der Reverse Proxy
    networks: [datenbank]
    volumes:
      - /var/lib/@DIENST@:/var/lib/@DIENST@
      - /var/log/@DIENST@:/var/log/@DIENST@
      - /var/backups/@DIENST@:/var/backups/@DIENST@
    # Härtung wie die systemd-Unit: nur Lesezugriff aufs Abbild, keine Zusatzrechte
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    # Ausgabe ins Journal (journalctl CONTAINER_NAME=@DIENST@) – so greift auch der Log-Versand des Hosts
    logging:
      driver: journald
      options:
        tag: "@DIENST@"
networks:
  datenbank:
    name: @DB_NETZ@
    external: true
