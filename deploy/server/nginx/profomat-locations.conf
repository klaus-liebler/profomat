# ProfOMat im Server-Block von liebler.conf (Vorlage → /etc/nginx/snippets/@DIENST@-locations.conf).
# Eingebunden über /etc/nginx/liebler.d/@DIENST@.conf (Schritt 01, gemeinsames Schema schritte/liebler-nginx.sh).
# Testsystem ohne Hochschulanmeldung (nur Testanmeldung bzw. Startkonto): Darum steht ALLES hinter dem Zugangspasswort, auch statische
# Dateien, das öffentliche Antragsformular und die Statuslinks für Studierende. Ausnahmen nur in @DIENST@-ohne-passwort.conf.
location = @PFAD@ { return 301 @PFAD@/; }

include /etc/nginx/snippets/@DIENST@-ohne-passwort.conf;

location @PFAD@/ {
    auth_basic           "ProfOMat Testsystem";
    auth_basic_user_file /etc/nginx/@DIENST@.htpasswd;
    # Suchmaschinen fernhalten (Testsystem)
    add_header X-Robots-Tag "noindex, nofollow" always;
    include /etc/nginx/snippets/@DIENST@-proxy.conf;
}
