# ProfOMat im Server-Block von liebler.conf (Vorlage → /etc/nginx/snippets/@DIENST@-locations.conf).
# Eingebunden über /etc/nginx/liebler.d/@DIENST@.conf (Schritt 01, gemeinsames Schema schritte/liebler-nginx.sh).
#
# Bewusst OHNE nginx-Passwort (wie Podium): Studierende stellen den Antrag auf mündliche Drittprüfung ohne Anmeldung
# (geschützt durch Sicherheitsaufgabe, Köderfeld und Grenze je Mailadresse). Alles für Lehrende und Verwaltung schützt die
# Anmeldung in der App (Konten, Einladungs- und Passwort-Links, Sperre nach Fehlversuchen, Sitzungsstempel).
# Kestrel lauscht nur auf 127.0.0.1:@PORT@; die Anwendung kennt die Pfad-Basis @PFAD@ (PathBase).
location = @PFAD@ { return 301 @PFAD@/; }

location @PFAD@/ {
    include /etc/nginx/snippets/@DIENST@-proxy.conf;
}
