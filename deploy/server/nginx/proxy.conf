# Gemeinsame Proxy-Einstellungen (Vorlage → /etc/nginx/snippets/@DIENST@-proxy.conf)
proxy_pass         http://127.0.0.1:@PORT@;
proxy_http_version 1.1;
proxy_set_header   Upgrade $http_upgrade;
proxy_set_header   Connection $connection_upgrade;
proxy_set_header   Host $host;
proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header   X-Forwarded-Proto $scheme;
proxy_set_header   X-Forwarded-Host $host;
# Blazor Server hält eine Verbindung pro Sitzung offen
proxy_read_timeout 1h;
proxy_send_timeout 1h;
# Hochladen (Importe, Bilder); das Limit der Anwendung selbst kann kleiner sein
client_max_body_size 20m;
# Antwortköpfe der Anwendung (z. B. mehrteilige Cookies bei SAML) nicht abschneiden
proxy_buffer_size 32k;
proxy_buffers 8 32k;
